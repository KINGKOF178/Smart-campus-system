services:

  postgres:
    image: postgres:17
    container_name: smart-campus-postgres
    environment:
      POSTGRES_DB: smart_campus_energy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_campus_energy"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./energy-management
    container_name: smart-campus-backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
    container_name: smart-campus-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data: